name: Refresh explorer data

on:
  schedule:
    - cron: '23 16 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: explorer-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Finance/requirements.txt
      - run: python -m pip install -r Finance/requirements.txt
      - run: python -m unittest discover -s Finance/tests
      - name: Generate the explorer and campus snapshots
        run: |
          python Finance/run_all.py
          python Finance/scrapers/campus_endowments.py
      - name: Propose changed snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot=Webapp/static/data/holdings-snapshot.json
          campus=Webapp/static/data/campus-endowments.json

          # A new check timestamp alone does not warrant a data release.
          unchanged=$(python - "$snapshot" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          path = sys.argv[1]
          previous = json.loads(subprocess.check_output(["git", "show", f"HEAD:{path}"]))
          current = json.loads(Path(path).read_text())
          for document in (previous, current):
              document.pop("checkedAt", None)
          print(previous == current)
          PY
          )
          if [ "$unchanged" = True ]; then
            git restore -- "$snapshot"
          fi

          if git diff --quiet -- "$snapshot" "$campus"; then
            echo "The published holdings and campus figures are unchanged."
            exit 0
          fi

          pending=$(gh pr list --state open --json headRefName,url --jq \
            '.[] | select(.headRefName | startswith("data-refresh/")) | .url')
          if [ -n "$pending" ]; then
            printf 'A data refresh is already awaiting review: %s\n' "$pending"
            exit 0
          fi

          branch="data-refresh/$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add -- "$snapshot" "$campus"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Refresh UC Investment Explorer data"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Refresh UC Investment Explorer data" \
            --body "Refreshed the explorer and campus datasets from their dated sources. The refresh verified the UC disclosures and SEC filing before replacing the snapshot."
